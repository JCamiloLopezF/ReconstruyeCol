# Configuracion de despliegue en Fly.io para el backend (Spring Boot).
# Generado para el MVP de ReconstruyeCol — ver docs/02-diseno-tecnico.md, seccion 10.
#
# Antes del primer deploy:
#   fly launch --no-deploy --copy-config --name reconstruyecol-backend
#   fly secrets set DB_URL="jdbc:postgresql://<host-supabase>:5432/postgres?sslmode=require" \
#                    DB_USERNAME="postgres.<ref-proyecto>" \
#                    DB_PASSWORD="<password-supabase>"
# Luego, en cada push a main (o manualmente): fly deploy

app = "reconstruyecol-backend"
primary_region = "bog"  # Bogota — menor latencia para usuarios en Colombia

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
