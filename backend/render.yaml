# Blueprint de despliegue en Render.com para el backend (Spring Boot).
# Generado para el MVP de ReconstruyeCol — ver docs/03-despliegue.md.
#
# Uso: en el dashboard de Render, "New +" -> "Blueprint" -> conectar el repo.
# Render detecta este archivo, crea el servicio y pide valores para las
# variables marcadas con "sync: false" (DB_URL, DB_USERNAME, DB_PASSWORD).

services:
  - name: reconstruyecol-backend
    type: web
    runtime: docker
    rootDir: backend  # solo controla que cambios fuera de backend/ no disparen rebuild
    dockerfilePath: backend/Dockerfile  # relativo a la raiz del repo, no a rootDir
    dockerContext: backend
    plan: free
    region: virginia  # sin region en Sudamerica en el free tier; la mas cercana a Colombia
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
