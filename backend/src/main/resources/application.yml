spring:
  application:
    name: ayudaterremoto

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ayudaterremoto}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # Ajustado al limite de conexiones del plan gratuito de Supabase (seccion 11 del diseno tecnico).
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
