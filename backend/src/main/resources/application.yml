spring:
  application:
    name: ayudaterremoto

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ayudaterremoto}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
