spring:
  application:
    name: ayudaterremoto

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ayudaterremoto}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # Ajustado al limite de conexiones del plan gratuito de Supabase (seccion 11 del diseno tecnico).
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # Default solo para desarrollo local. En produccion SIEMPRE sobreescribir con JWT_SECRET
    # (minimo 32 caracteres aleatorios, ej. `openssl rand -base64 32`) - ver docs/03-despliegue.md.
    secret: ${JWT_SECRET:clave-secreta-local-de-desarrollo-cambiar-en-produccion-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  supabase:
    # URL del proyecto (https://<ref>.supabase.co), NO el host de la base de datos (db.<ref>...).
    url: ${SUPABASE_URL:}
    # Secret key nueva de Supabase (Settings -> API Keys -> Secret keys, formato sb_secret_...),
    # no la anon/publishable key.
    secret-key: ${SUPABASE_SECRET_KEY:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:soportes-ingenieros}
  admin:
    # Solo se usan para crear el primer administrador si la tabla admins esta vacia (AdminSeeder).
    # Defaults inseguros solo para desarrollo local. En produccion SIEMPRE sobreescribir ambas.
    seed-email: ${ADMIN_SEED_EMAIL:admin@reconstruyecol.org}
    seed-password: ${ADMIN_SEED_PASSWORD:cambiar-esta-password-admin-0123456789}
